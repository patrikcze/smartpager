<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartPager Console</title>
<style>
:root{
  --bg:#0a0b10;--card:#1a1c25;--card2:#232633;--line:#2c3040;--text:#f3f4f8;--sub:#b4bacb;--dim:#7a8194;
  --accent:#9b8cff;--ok:#34c77b;--warn:#ffb020;--bad:#ff4d5e;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,11,16,.92);backdrop-filter:blur(8px);z-index:2}
header h1{font-size:15px;letter-spacing:.14em;font-weight:600;margin:0;color:var(--sub)}
header .sp{flex:1}
main{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px 20px;max-width:1200px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:1fr;padding:14px 16px}}
section{background:var(--card);border-radius:16px;padding:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 12px;font-weight:600}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0f1117;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
button{background:var(--accent);color:#14112b;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:650;cursor:pointer}
button.ghost{background:var(--card2);color:var(--sub);font-weight:500}
button.danger{background:transparent;color:var(--bad);padding:6px 8px}
button:disabled{opacity:.5;cursor:default}
.stack>*+*{margin-top:18px}
.msg{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:12px;border-radius:12px;background:var(--card2);margin-bottom:8px}
.msg.unread{box-shadow:inset 3px 0 0 var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.who{font-weight:650}.subj{color:var(--sub)}.body{color:var(--dim);white-space:pre-wrap;margin-top:4px;max-height:4.4em;overflow:hidden}
.meta{color:var(--dim);font-size:12px;text-align:right;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:#0f1117;color:var(--dim);border:1px solid var(--line)}
.chip.on{color:var(--ok);border-color:rgba(52,199,123,.4)}
.chip.p2{color:var(--warn);border-color:rgba(255,176,32,.4)}.chip.p3{color:var(--bad);border-color:rgba(255,77,94,.45)}
.actions{display:flex;gap:4px;justify-content:flex-end;margin-top:6px}
.actions button{padding:4px 8px;font-size:12px}
.filters{display:flex;gap:8px;margin-bottom:12px}.filters select{width:auto}
.dev{padding:10px 12px;background:var(--card2);border-radius:12px;margin-bottom:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--dim)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.empty{color:var(--dim);text-align:center;padding:30px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
code.tok{display:block;word-break:break-all;background:#0f1117;padding:8px;border-radius:8px;margin-top:6px;color:var(--warn)}
#login{max-width:420px;margin:12vh auto;padding:0 16px}
</style>
</head>
<body>
<div id="login" hidden>
  <section>
    <h2>SmartPager console</h2>
    <p style="color:var(--dim);margin-top:0">Enter the admin token (SMARTPAGER_ADMIN_TOKEN). It is kept only in this browser tab.</p>
    <form id="loginForm"><input id="tokenIn" type="password" autocomplete="off" placeholder="Admin token" required>
    <div style="margin-top:12px"><button>Unlock</button></div></form>
  </section>
</div>
<div id="app" hidden>
<header><h1>SMARTPAGER</h1><span class="sp"></span><span id="health" class="chip">…</span><button class="ghost" id="logout">Lock</button></header>
<main>
  <div class="stack">
    <section>
      <h2>Compose</h2>
      <form id="compose">
        <div class="row">
          <div><label>Source</label><select name="source"><option>manual</option><option>system</option><option>monitoring</option><option>webhook</option><option>email</option><option>imessage</option></select></div>
          <div><label>Priority</label><select name="priority"><option>low</option><option selected>normal</option><option>high</option><option>critical</option></select></div>
        </div>
        <label>Sender</label><input name="sender" maxlength="120" placeholder="Ops">
        <label>Subject</label><input name="subject" maxlength="200" placeholder="Backup completed">
        <label>Message</label><textarea name="body" maxlength="4000" placeholder="Type a message…"></textarea>
        <div style="margin-top:12px"><button id="sendBtn">Send to pager</button></div>
      </form>
    </section>
    <section>
      <h2>Devices</h2>
      <div id="devices"></div>
      <form id="newDev" class="row" style="margin-top:10px"><input name="id" placeholder="new device id (e.g. pager-2)" pattern="[a-z0-9][a-z0-9-]+" required><button class="ghost" style="flex:0 0 auto">Add</button></form>
      <div id="newTok"></div>
    </section>
  </div>
  <section>
    <h2>Messages</h2>
    <div class="filters">
      <select id="fSource"><option value="">All sources</option><option>manual</option><option>system</option><option>monitoring</option><option>webhook</option><option>email</option><option>imessage</option></select>
      <select id="fUnread"><option value="">All</option><option value="1">Unread</option></select>
    </div>
    <div id="list"></div>
  </section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const COLORS = {email:'#5b9dff',imessage:'#34c77b',monitoring:'#ff8a3d',system:'#a78bfa',webhook:'#22c3e6',manual:'#f5c451'};
let token = '';
try { token = sessionStorage.getItem('sp_admin') || ''; } catch (e) {}

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ago(iso){if(!iso)return'';const d=(Date.now()-Date.parse(iso))/1000;if(d<60)return'now';if(d<3600)return Math.floor(d/60)+'m';if(d<86400)return Math.floor(d/3600)+'h';return new Date(iso).toLocaleDateString();}

async function api(path, opts={}){
  const r = await fetch(path,{...opts,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401){lock();throw new Error('unauthorized');}
  if(!r.ok){let d;try{d=(await r.json()).detail}catch(e){}throw new Error(typeof d==='string'?d:JSON.stringify(d)||r.statusText);}
  return r.status===204?null:r.json();
}

function lock(){token='';try{sessionStorage.removeItem('sp_admin')}catch(e){}$('#app').hidden=true;$('#login').hidden=false;}
async function unlock(){ $('#login').hidden=true;$('#app').hidden=false; await refresh(); }

async function refresh(){
  try{
    const h = await fetch('/health').then(r=>r.json());
    $('#health').textContent='server '+h.version+' · seq '+h.seq; $('#health').className='chip on';
  }catch(e){$('#health').textContent='server offline';$('#health').className='chip p3';}
  const q = new URLSearchParams({limit:'100'});
  if($('#fSource').value) q.set('source',$('#fSource').value);
  if($('#fUnread').value) q.set('unread','true');
  const [msgs, devs] = await Promise.all([api('/api/v1/messages?'+q), api('/api/v1/devices')]);
  renderList(msgs.messages); renderDevices(devs);
}

function renderList(ms){
  if(!ms.length){$('#list').innerHTML='<div class="empty">No messages</div>';return;}
  $('#list').innerHTML = ms.map(m=>{
    const c = COLORS[m.source]||COLORS.manual, p = {low:0,normal:1,high:2,critical:3}[m.priority];
    return `<div class="msg ${m.read_at?'':'unread'}">
      <div class="avatar" style="background:${c}22;color:${c}">${esc((m.sender||m.source)[0]||'?').toUpperCase()}</div>
      <div><div class="who">${esc(m.sender||m.source)}</div><div class="subj">${esc(m.subject)}</div><div class="body">${esc(m.body)}</div>
        <div class="chips"><span class="chip">${esc(m.source)}</span>${p>=2?`<span class="chip p${p}">${m.priority}</span>`:''}
        <span class="chip ${m.delivered_at?'on':''}">delivered</span><span class="chip ${m.read_at?'on':''}">read</span><span class="chip ${m.acknowledged_at?'on':''}">acknowledged</span></div></div>
      <div><div class="meta" title="${esc(m.received_at)}">${ago(m.received_at)} · #${m.id}</div>
        <div class="actions">${m.read_at?'':`<button class="ghost" data-a="read" data-id="${m.id}">Read</button>`}${m.acknowledged_at?'':`<button class="ghost" data-a="ack" data-id="${m.id}">Ack</button>`}<button class="danger" data-a="del" data-id="${m.id}">Delete</button></div></div>
    </div>`}).join('');
}

function renderDevices(ds){
  if(!ds.length){$('#devices').innerHTML='<div class="empty" style="padding:10px 0">No devices yet</div>';return;}
  $('#devices').innerHTML = ds.map(d=>{
    const fresh = d.last_seen_at && (Date.now()-Date.parse(d.last_seen_at))<90000;
    const st = d.status||{};
    return `<div class="dev"><div><span class="dot ${fresh?'ok':d.last_seen_at?'warn':''}"></span><b>${esc(d.id)}</b> <span style="color:var(--dim)">${esc(d.name)}</span></div>
      <div style="color:var(--dim);font-size:12px;margin-top:4px">${d.last_seen_at?(ago(d.last_seen_at)==='now'?'seen just now':'seen '+ago(d.last_seen_at)+' ago'):'never connected'}${d.last_ip?' · '+esc(d.last_ip):''}${d.firmware?' · fw '+esc(d.firmware):''}${st.rssi?' · '+st.rssi+' dBm':''} · cursor ${d.acked_cursor}</div></div>`}).join('');
}

$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();token=$('#tokenIn').value.trim();
  try{await api('/api/v1/devices');try{sessionStorage.setItem('sp_admin',token)}catch(e){};$('#tokenIn').value='';unlock();}catch(err){toast('Invalid token');}});
$('#logout').onclick=lock;
$('#fSource').onchange=refresh;$('#fUnread').onchange=refresh;
$('#compose').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const body=Object.fromEntries(f.entries());
  if(!body.subject&&!body.body){toast('Write a subject or message');return;}
  $('#sendBtn').disabled=true;
  try{await api('/api/v1/messages',{method:'POST',body:JSON.stringify(body)});e.target.subject.value='';e.target.body.value='';toast('Sent');refresh();}
  catch(err){toast(err.message)} finally{$('#sendBtn').disabled=false;}});
$('#list').addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id;
  try{ if(b.dataset.a==='del'){if(!confirm('Delete message #'+id+'?'))return;await api('/api/v1/messages/'+id,{method:'DELETE'});}
       else await api(`/api/v1/messages/${id}/${b.dataset.a}`,{method:'POST'});
       refresh();}catch(err){toast(err.message)}});
$('#newDev').addEventListener('submit',async e=>{e.preventDefault();try{
  const r=await api('/api/v1/devices',{method:'POST',body:JSON.stringify({id:e.target.id.value.trim()})});
  $('#newTok').innerHTML=`<label>Token for ${esc(r.device.id)} — copy it now, it is not shown again</label><code class="tok">${esc(r.token)}</code>`;
  e.target.reset();refresh();}catch(err){toast(err.message)}});

if(token) unlock().catch(()=>lock()); else lock();
setInterval(()=>{if(token&&!document.hidden)refresh().catch(()=>{})},5000);
</script>
</body>
</html>
