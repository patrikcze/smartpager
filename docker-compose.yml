services:
  smartpager:
    build: ./server
    image: smartpager-server:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      SMARTPAGER_DB: /data/smartpager.db  # overrides the native path from .env
    volumes:
      - smartpager-data:/data
    # Bound to localhost by default. To let the pager reach it over the LAN, change to
    # "0.0.0.0:8080:8080" (trusted network only) or put it behind an HTTPS reverse proxy.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # Optional e-mail connector: `docker compose --profile email up -d`
  imap:
    profiles: [email]
    build: ./server
    image: smartpager-server:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      SMARTPAGER_URL: http://smartpager:8080
    command: ["python", "-m", "app.integrations.imap_connector"]
    depends_on: [smartpager]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  smartpager-data:
