services:
  smartpager:
    build: ./server
    image: smartpager-server:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      SMARTPAGER_DB: /data/smartpager.db  # overrides the native path from .env
      # Trust X-Forwarded-For only from the Caddy container (static address below), so
      # rate limiting and the audit log see real client addresses behind the proxy.
      FORWARDED_ALLOW_IPS: 172.30.0.2
    volumes:
      - smartpager-data:/data
    networks:
      smartpager:
        ipv4_address: 172.30.0.10
    # SMARTPAGER_BIND (in .env) defaults to localhost. Set it to 0.0.0.0 so the pager can reach
    # the server over the LAN (trusted network only), or put an HTTPS reverse proxy in front.
    ports:
      - "${SMARTPAGER_BIND:-127.0.0.1}:${SMARTPAGER_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # Public HTTPS front end with automatic Let's Encrypt: `docker compose --profile public up -d`
  # Needs SMARTPAGER_DOMAIN and ACME_EMAIL in .env and ports 80/443 forwarded to this machine.
  caddy:
    profiles: [public]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on: [smartpager]
    environment:  # only what Caddy needs; never hand it the API secrets in .env
      SMARTPAGER_DOMAIN: ${SMARTPAGER_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-nobody@localhost.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      smartpager:
        ipv4_address: 172.30.0.2
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  # Optional e-mail connector: `docker compose --profile email up -d`
  imap:
    profiles: [email]
    build: ./server
    image: smartpager-server:0.1.0
    restart: unless-stopped
    # Least privilege: only the IMAP settings and a dedicated ingest token, never the admin token.
    environment:
      SMARTPAGER_URL: http://smartpager:8080
      SMARTPAGER_INGEST_TOKEN: ${IMAP_INGEST_TOKEN:-}  # make ingest-token NAME=imap
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_POLL_SECONDS: ${IMAP_POLL_SECONDS:-60}
      IMAP_ALLOW_SENDERS: ${IMAP_ALLOW_SENDERS:-}
      IMAP_DENY_SENDERS: ${IMAP_DENY_SENDERS:-}
    command: ["python", "-m", "app.integrations.imap_connector"]
    depends_on: [smartpager]
    networks: [smartpager]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  smartpager:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  smartpager-data:
  caddy-data:
  caddy-config:
