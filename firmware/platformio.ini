; SmartPager firmware — LILYGO T-Display-S3 (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM)
;
; Versions are pinned to what LILYGO's official T-Display-S3 repository builds with
; (espressif32@6.5.0 => arduino-esp32 2.0.14 / ESP-IDF 4.4.6) to keep the esp_lcd i80
; ST7789 driver behaviour identical to the factory firmware.

[platformio]
default_envs = tdisplays3

[common]
lib_deps =
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.2.1

[env:tdisplays3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps = ${common.lib_deps}
build_flags =
    -std=gnu++17
    ; PlatformIO's built-in board omits this (LILYGO's board file has it); without it the
    ; core never initializes the 8 MB OPI PSRAM (verified on hardware: diag showed 0 KB).
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
build_src_filter = +<*> -<sim/> -<diag/>

; Minimal hardware verification image: colour bars, orientation, I2C/touch scan, buttons.
[env:diag]
extends = env:tdisplays3
build_src_filter = +<diag/> +<hardware/display.cpp> +<hardware/input.cpp> +<ui/fonts/>

; Host-side unit tests: message store, sync parsing, retry policy, button FSM, formatting.
[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@7.2.1
build_flags = -std=c++17 -Iinclude -Isrc -DSMARTPAGER_HOST
build_src_filter = +<messaging/> +<ui/format.cpp>
test_build_src = yes

; Host-side UI renderer: builds the real LVGL screens with mock messages and writes PNG
; screenshots at the panel's native 320x170 resolution (no hardware required).
[env:sim]
platform = native
lib_deps = ${common.lib_deps}
build_flags = -std=c++17 -Iinclude -Isrc -DSMARTPAGER_HOST -DLV_CONF_INCLUDE_SIMPLE -DLV_LVGL_H_INCLUDE_SIMPLE -lz
build_src_filter = +<ui/> +<messaging/> +<sim/>
