# SmartPager behind an nginx that already runs on the server (use INSTEAD of the bundled Caddy
# when ports 80/443 are taken by an existing web server). See docs/GUIDE.md, "Ports 80/443 are
# already in use".
#
# Requirements:
#   - certificate for pager.example.com, e.g.:  sudo certbot --nginx -d pager.example.com
#   - SmartPager started with `make up` (not up-public), SMARTPAGER_BIND=127.0.0.1,
#     SMARTPAGER_TRUSTED_PROXY=172.30.0.1 in .env (the app then trusts X-Forwarded-For from nginx)
# Replace pager.example.com (3x) and place this file in /etc/nginx/conf.d/ (or sites-enabled/).

server {
    listen 80;
    listen [::]:80;
    server_name pager.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }   # certbot HTTP-01
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pager.example.com;

    ssl_certificate     /etc/letsencrypt/live/pager.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pager.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;
    client_max_body_size 64k;
    access_log off;   # URLs of webhook calls may contain ?token=

    # Same allow-list as deploy/Caddyfile: only what pagers and integrations need.
    location ~ "^/api/v1/devices/[a-z0-9][a-z0-9-]{1,39}/(sync|events|firmware|firmware/image)$" {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/smartpager-proxy.inc;
    }
    location ~ "^/api/v1/(messages|webhooks/generic|webhooks/alertmanager)$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/smartpager-proxy.inc;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/smartpager-proxy.inc;
    }
    location / { return 404; }   # /admin, /docs and the admin API are never exposed
}

# ---- save the following lines as /etc/nginx/smartpager-proxy.inc ----
